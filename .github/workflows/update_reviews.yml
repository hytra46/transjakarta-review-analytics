name: Update review TransJakarta

on:
  # Tombol "Run workflow" di tab Actions, untuk uji coba manual.
  workflow_dispatch:

  # Otomatis setiap hari pukul 02.00 UTC, yaitu 09.00 WIB.
  # GitHub memakai zona waktu UTC, jadi kurangi 7 jam dari jam WIB yang Anda mau.
  schedule:
    - cron: "0 2 * * *"

# Cegah dua pipeline berjalan bersamaan dan saling menimpa.
concurrency:
  group: update-reviews
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      HF_MODEL_ID: ${{ vars.HF_MODEL_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      APP_ID: ${{ vars.APP_ID }}
      TAHUN_TARGET: ${{ vars.TAHUN_TARGET }}

    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Pasang PyTorch versi CPU
        # Versi CPU ukurannya sekitar 200 MB, sedangkan versi standar lebih dari 2 GB.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Pasang library lainnya
        run: pip install -r requirements.txt

      - name: Simpan model di cache
        # Model 475 MB hanya diunduh sekali, lalu dipakai ulang di hari-hari berikutnya.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ vars.HF_MODEL_ID }}

      - name: Jalankan pipeline
        run: python pipeline/run_pipeline.py
